<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AWG Manager{% block title_suffix %}{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body { background: #0d1117; }
    .navbar-brand { font-weight: 700; letter-spacing: .05em; }
    .status-up   { color: #3fb950; }
    .status-down { color: #f85149; }
    .status-unknown { color: #8b949e; }
    .table th { font-size: .78rem; text-transform: uppercase; letter-spacing: .05em; color: #8b949e; border-color: #30363d; }
    .table td { border-color: #21262d; vertical-align: middle; }
    .table-dark { --bs-table-bg: #0d1117; }
    .card { border-color: #30363d; background: #161b22; }
    .card-header { border-color: #30363d; background: #1c2128; }
    .log-box { background: #010409; border: 1px solid #30363d; border-radius: .375rem;
               font-family: monospace; font-size: .82rem; padding: 1rem;
               max-height: 420px; overflow-y: auto; white-space: pre-wrap; }
    .spinner-sm { width: 1rem; height: 1rem; }
    .table-group-header td { background: #1c2128 !important; font-weight: 600;
                              color: #79c0ff; font-size: .8rem; letter-spacing: .06em; }
    .badge-dist { font-size: .7rem; }
  </style>
</head>
<body>
{% if session.host %}
<nav class="navbar navbar-expand-md navbar-dark" style="background:#161b22;border-bottom:1px solid #30363d">
  <div class="container-fluid">
    <span class="navbar-brand"><i class="bi bi-router me-2"></i>AWG Manager</span>
    <div class="ms-auto d-flex align-items-center gap-3">
      <span class="text-secondary small"><i class="bi bi-hdd-network me-1"></i>{{ session.host }}</span>
      <a href="{{ url_for('logout') }}" class="btn btn-sm btn-outline-secondary">
        <i class="bi bi-box-arrow-right me-1"></i>Выйти
      </a>
    </div>
  </div>
</nav>
{% endif %}

<div class="container-fluid py-4">
  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
